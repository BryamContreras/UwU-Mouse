name: Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build three development APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/*/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Check toolchain and install Android SDK components
        run: |
          set -euo pipefail
          flutter config --no-analytics --jdk-dir "$JAVA_HOME"
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'flutter-version.json')) as source:
              version = json.load(source)
          assert version['frameworkVersion'] == '3.47.2', version
          assert version['frameworkRevision'] == 'd3b14c876900e553bc736ca19295fc09e3853e8e', version
          assert version['dartSdkVersion'] == '3.13.2', version
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Dependencies, analysis and Flutter tests
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Restore development signing certificate
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null
          elif [[ "$WORKFLOW_EVENT" != 'pull_request' ]]; then
            echo '::error::Configure the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building installable updates.'
            exit 1
          else
            echo 'Pull request without signing secret: ephemeral development certificate.'
          fi

      - name: Build development release APKs by architecture
        run: flutter build apk --release --split-per-abi --android-project-arg=force-version-code-ignoring-abi=true

      - name: Kotlin tests, Android lint and independent InputLab
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :inputlab:testDebugUnitTest :inputlab:assembleDebug :inputlab:lintDebug

      - name: Name and verify architecture artifacts
        id: apk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil, subprocess, zipfile
          text = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+\+\d+)\s*$', text, re.M)
          if match is None:
              raise SystemExit('Missing numeric version in pubspec.yaml')
          version = match.group(1)
          version_code = version.split('+')[1]
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0' / 'aapt'
          output = pathlib.Path('release-apks')
          output.mkdir(exist_ok=True)
          checksums = []
          for abi in ('armeabi-v7a', 'arm64-v8a', 'x86_64'):
              source = pathlib.Path(f'build/app/outputs/flutter-apk/app-{abi}-release.apk')
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(source)], text=True)
              if f"versionCode='{version_code}'" not in badging.splitlines()[0]:
                  raise SystemExit(f'{source}: versionCode differs from local universal build')
              with zipfile.ZipFile(source) as apk:
                  packaged = {name.split('/')[1] for name in apk.namelist()
                              if name.startswith('lib/') and name.endswith('.so')}
                  if packaged != {abi}:
                      raise SystemExit(f'{source}: unexpected packaged ABIs {packaged}')
                  if f'lib/{abi}/libapp.so' not in apk.namelist():
                      raise SystemExit(f'{source}: missing Flutter application binary')
              target = output / f'UwU-Mouse-{version}-{abi}-dev.apk'
              shutil.copyfile(source, target)
              checksums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}')
          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as destination:
              destination.write(f'version={version}\n')
          PY

      - name: Upload ARM 64-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-arm64-v8a-dev
          path: release-apks/*-arm64-v8a-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ARM 32-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-armeabi-v7a-dev
          path: release-apks/*-armeabi-v7a-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload x86 64-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-x86_64-dev
          path: release-apks/*-x86_64-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-checksums
          path: release-apks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            build/app/reports/
            build/app/test-results/
            build/inputlab/reports/
            build/inputlab/test-results/
          if-no-files-found: ignore
          retention-days: 7
