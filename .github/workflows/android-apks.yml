name: Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build three development APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read and validate shared toolchain
        id: toolchain
        run: python3 tools/check_toolchain.py --github-output "$GITHUB_OUTPUT"

      - name: Java from shared toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/toolchain.properties

      - name: Flutter stable from shared toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          cache: true

      - name: Check toolchain and install Android SDK components
        run: |
          set -euo pipefail
          flutter config --no-analytics --jdk-dir "$JAVA_HOME"
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 tools/check_toolchain.py --flutter-json "$RUNNER_TEMP/flutter-version.json"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'cmdline-tools;${{ steps.toolchain.outputs.commandLineTools }}'
          "$ANDROID_HOME/cmdline-tools/${{ steps.toolchain.outputs.commandLineTools }}/bin/sdkmanager" --install \
            'platforms;android-${{ steps.toolchain.outputs.sdkPlatform }}' \
            'build-tools;${{ steps.toolchain.outputs.buildTools }}' \
            'ndk;${{ steps.toolchain.outputs.ndk }}' 'cmake;${{ steps.toolchain.outputs.cmake }}'

      - name: Dependencies, analysis and Flutter tests
        run: |
          set -euo pipefail
          python3 tools/check_architecture.py --json
          python3 -m unittest discover -s tools/tests -v
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Restore development signing certificate
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null
            certificate_sha=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey | sha256sum)
            if [[ "${certificate_sha%% *}" != '940a68a15fb6e37f42b0efcc7d175ea79e31e13f7e9995a50e9d6117c02e5bc6' ]]; then
              echo '::error::The restored development certificate does not match the configured installation.'
              exit 1
            fi
            printf 'Development certificate SHA-256: %s\n' "${certificate_sha%% *}"
            printf 'UWU_ANDROID_DEBUG_KEYSTORE=%s\n' "$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          elif [[ "$WORKFLOW_EVENT" != 'pull_request' ]]; then
            echo '::error::Configure the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building installable updates.'
            exit 1
          else
            echo 'Pull request without signing secret: ephemeral development certificate.'
          fi

      - name: Build development release APKs by architecture
        run: flutter build apk --release --split-per-abi --android-project-arg=force-version-code-ignoring-abi=true

      - name: Verify native libraries on 16 KB memory pages
        run: python3 tools/check_android_native_alignment.py 'build/app/outputs/flutter-apk/*-release.apk' --json

      - name: Tests and lint for every Android module, independent InputLab
        working-directory: android
        run: |
          set -euo pipefail
          mapfile -t check_tasks < ../tools/android-check-tasks.txt
          bash ./gradlew --no-daemon --max-workers=2 --console=plain "${check_tasks[@]}"

      - name: Check compiled Android JSON ABI
        run: python3 tools/check_android_json_abi.py --classes build/mapper-core/classes/kotlin/main --json

      - name: Native capture rate and device capability tests
        run: python3 tools/test_capture_policy.py

      - name: Name and verify architecture artifacts
        id: apk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, zipfile
          from tools.check_toolchain import load_toolchain
          text = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+\+\d+)\s*$', text, re.M)
          if match is None:
              raise SystemExit('Missing numeric version in pubspec.yaml')
          version = match.group(1)
          version_code = version.split('+')[1]
          application_id = json.loads(pathlib.Path('architecture/modules.json').read_text(encoding='utf-8'))['compatibility']['production_application_id']
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / load_toolchain()['buildTools'] / 'aapt2'
          apksigner = aapt.with_name('apksigner')
          keystore = os.environ.get('UWU_ANDROID_DEBUG_KEYSTORE')
          expected_certificate = None
          if keystore:
              certificate = subprocess.check_output([
                  'keytool', '-exportcert', '-keystore', keystore,
                  '-storepass', 'android', '-alias', 'androiddebugkey'])
              expected_certificate = hashlib.sha256(certificate).hexdigest()
              if expected_certificate != '940a68a15fb6e37f42b0efcc7d175ea79e31e13f7e9995a50e9d6117c02e5bc6':
                  raise SystemExit('Restored development certificate differs from the configured installation')
          output = pathlib.Path('release-apks')
          output.mkdir(exist_ok=True)
          checksums = []
          for abi in ('armeabi-v7a', 'arm64-v8a', 'x86_64'):
              source = pathlib.Path(f'build/app/outputs/flutter-apk/app-{abi}-release.apk')
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(source)], text=True)
              package = dict(re.findall(r"(\w+)='([^']*)'", badging.splitlines()[0]))
              if package.get('name') != application_id:
                  raise SystemExit(f'{source}: applicationId differs from the project identity')
              if package.get('versionCode') != version_code or package.get('versionName') != version.split('+', 1)[0]:
                  raise SystemExit(f'{source}: version differs from pubspec.yaml')
              signing = subprocess.check_output([str(apksigner), 'verify', '--print-certs', str(source)], text=True)
              signers = re.findall(r'^(?:Signer #\d+:?|V\d+ Signer:) certificate SHA-256 digest:\s*([a-fA-F0-9]{64})\s*$', signing, re.M)
              if not signers or len({value.lower() for value in signers}) != 1 or (expected_certificate and any(value.lower() != expected_certificate for value in signers)):
                  raise SystemExit(f'{source}: APK signing certificate differs from the restored key')
              with zipfile.ZipFile(source) as apk:
                  packaged = {name.split('/')[1] for name in apk.namelist()
                              if name.startswith('lib/') and name.endswith('.so')}
                  if packaged != {abi}:
                      raise SystemExit(f'{source}: unexpected packaged ABIs {packaged}')
                  for library in ('libapp.so', 'libflutter.so', 'libuwu_capture.so', 'libuwu_adb.so'):
                      if f'lib/{abi}/{library}' not in apk.namelist():
                          raise SystemExit(f'{source}: missing required application/native binary {library}')
              target = output / f'UwU-Mouse-{version}-{abi}-dev.apk'
              shutil.copyfile(source, target)
              checksums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}')
          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as destination:
              destination.write(f'version={version}\n')
          PY

      - name: Upload ARM 64-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-arm64-v8a-dev
          path: release-apks/*-arm64-v8a-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ARM 32-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-armeabi-v7a-dev
          path: release-apks/*-armeabi-v7a-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload x86 64-bit APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-x86_64-dev
          path: release-apks/*-x86_64-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UwU-Mouse-${{ steps.apk.outputs.version }}-checksums
          path: release-apks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            build/*/reports/
            build/*/test-results/
          if-no-files-found: ignore
          retention-days: 7
